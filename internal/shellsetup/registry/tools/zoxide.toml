id = "zoxide"
kind = "plugin"
depends = ["mise"]

[install]
backend = "mise"
package = "zoxide"

[check]
cmd = ["zoxide", "--version"]

[shell]
priority = 60
snippet = '''
eval "$(zoxide init zsh)"
alias cd="z"
'''

# The old install.sh put zoxide here; purged once mise provides it.
[legacy]
paths = ["~/.local/bin/zoxide"]
