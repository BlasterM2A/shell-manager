id = "starship"
kind = "plugin"
depends = ["mise"]

[install]
backend = "mise"
package = "starship"

[check]
cmd = ["starship", "--version"]

[shell]
priority = 50
snippet = '[[ $TERM == dumb ]] || eval "$(starship init zsh)"'

[[files]]
src = "files/starship/starship.toml"
dest = "~/.config/starship.toml"
