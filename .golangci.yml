version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        business-logic:
          files:
            - "**/internal/shellmanager/**"
            - "**/internal/selfupdate/**"
            - "**/internal/config/**"
          deny:
            - pkg: github.com/BlasterM2A/shell-manager/internal/ui
              desc: business logic must not depend on the UI
            - pkg: github.com/BlasterM2A/shell-manager/internal/iostreams
              desc: business logic must not write to the console
            - pkg: github.com/BlasterM2A/shell-manager/internal/cmd
              desc: business logic must not depend on commands
            - pkg: charm.land
              desc: business logic must not depend on UI libraries
        ui:
          files:
            - "**/internal/ui/**"
            - "**/internal/iostreams/**"
            - "**/internal/log/**"
          deny:
            - pkg: github.com/BlasterM2A/shell-manager/internal/shellmanager
              desc: the UI must not depend on business logic
            - pkg: github.com/BlasterM2A/shell-manager/internal/cmd
              desc: the UI must not depend on commands

formatters:
  enable:
    - gofmt
